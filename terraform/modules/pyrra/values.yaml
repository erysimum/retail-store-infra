# Pyrra Helm values (chart 1.5.0+ schema)
#
# Pyrra has two components, both deployed unconditionally by this chart:
# 1. API Server — web UI showing SLO status, error budget, burn rate
# 2. Kubernetes Operator — watches for ServiceLevelObjective CRDs and
#    generates PrometheusRules

# URL to the in-cluster Prometheus instance (templated from Terraform)
prometheusUrl: "${prometheus_url}"

# API Server service (the UI)
service:
  type: ClusterIP
  port: 9099

# API Server resources
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Operator-specific configuration
operator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi