# kube-prometheus-stack Helm values override
# Variables like ${retention_days} are interpolated by Terraform's templatefile()

# -----------------------------------------------
# Prometheus
# -----------------------------------------------
prometheus:
  prometheusSpec:
    retention: ${retention_days}d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${storage_size}

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

    # Discover ServiceMonitors from ALL namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}

    # Discover PrometheusRules from ALL namespaces
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

# -----------------------------------------------
# Alertmanager — full routing config
# -----------------------------------------------
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  # Alertmanager routing configuration
  # Defines: where alerts go based on severity labels
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "${slack_webhook_url}"

    # Routing tree — first match wins
    route:
      # Default catch-all goes to Slack
      receiver: 'slack-default'
      # Group alerts to avoid spam
      group_by: ['alertname', 'service', 'severity']
      group_wait: 30s          # Wait 30s after first alert before sending
      group_interval: 5m       # Wait 5m before sending updates to same group
      repeat_interval: 12h     # Resend unresolved alerts every 12h

      routes:
        # Watchdog alert (Prometheus heartbeat) → null receiver
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'

        # Critical alerts → PagerDuty AND Slack (continue: true falls through)
        - matchers:
            - severity = "critical"
          receiver: 'pagerduty'
          continue: true

        - matchers:
            - severity = "critical"
          receiver: 'slack-critical'

        # Warning alerts → Slack only
        - matchers:
            - severity = "warning"
          receiver: 'slack-warnings'
       

    # Inhibition: if a critical alert is firing, suppress
    # related warning alerts to avoid duplicate noise
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'service']

    # Alert receivers (the destinations)
    receivers:
      # Black hole for Watchdog
      - name: 'null'

      # Default Slack — for anything not caught by specific routes
      - name: 'slack-default'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
              *Description:* {{ .Annotations.description }}
              *Service:* {{ .Labels.service }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}

      # Critical alerts to Slack (also goes to PagerDuty in parallel)
      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            color: 'danger'
            title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *PAGING ON-CALL ENGINEER*
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Service:* {{ .Labels.service }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}

      # Warning alerts to Slack
      - name: 'slack-warnings'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            color: 'warning'
            title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Service:* {{ .Labels.service }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}

      # PagerDuty for critical alerts (phone call)
      - name: 'pagerduty'
        pagerduty_configs:
          - service_key: "${pagerduty_integration_key}"
            description: '{{ .CommonAnnotations.summary }}'
            details:
              alertname: '{{ .CommonLabels.alertname }}'
              service: '{{ .CommonLabels.service }}'
              severity: '{{ .CommonLabels.severity }}'
              description: '{{ .CommonAnnotations.description }}'
              runbook: '{{ .CommonAnnotations.runbook_url }}'

# -----------------------------------------------
# Grafana
# -----------------------------------------------
grafana:
  adminPassword: "${grafana_password}"

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
    datasources:
      enabled: true
      searchNamespace: ALL
      label: grafana_datasource

# -----------------------------------------------
# node-exporter
# -----------------------------------------------
nodeExporter:
  enabled: true

# -----------------------------------------------
# kube-state-metrics
# -----------------------------------------------
kubeStateMetrics:
  enabled: true

# -----------------------------------------------
# Prometheus Operator
# -----------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
